name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  node:
    name: Engine, API and web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Engine + API tests
        run: npm test

      - name: Web build
        run: npm run build

  flutter:
    name: Flutter app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.35.x
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
